# A GitHub Release (vX.Y.Z) does three things:
#   1. Zenodo (GitHub integration) archives the release and mints the version DOI;
#   2. npm publish via Trusted Publisher (OIDC, no token);
#   3. PyPI publish via Trusted Publishing (OIDC, no token).
# Packages are published only if every test vector matches.
name: release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - name: tag = package.json version
        working-directory: packages/js
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - working-directory: packages/js
        run: npm ci && npm run build && npm test && npm publish --access public
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: tag = pyproject version
        working-directory: packages/python
        run: test "v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - working-directory: packages/python
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: packages/python/dist }
